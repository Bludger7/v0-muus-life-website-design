name: Firebase'e yayınla
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: noyer-hosting
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund --legacy-peer-deps
      - run: npm run build
      - uses: google-github-actions/auth@v3
        with:
          project_id: muus-life
          workload_identity_provider: projects/1084433958253/locations/global/workloadIdentityPools/noyer-github-deploy/providers/github
      - name: Önizlemeyi yayımla
        run: npx -y firebase-tools hosting:channel:deploy github-preview --expires 1d --project muus-life --non-interactive
      - name: Canlıya yayımla
        if: github.event_name == 'push' && !contains(github.event.head_commit.message, '[preview only]')
        run: npx -y firebase-tools deploy --only hosting --project muus-life --non-interactive
